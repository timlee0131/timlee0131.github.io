- title: Teaching & Invited Talks
  type: time_table
  contents:
    - title: Understanding the Failure Modes of Transformers through the Lens of Graph Neural Networks
      institution: Invited Lecture · SMU Lyle School of Engineering & Guildhall
      year: Fall 2026
      description:
        - 90-minute lecture on information-propagation issues in causal transformers, viewed through the GNN theory of oversquashing and oversmoothing
        - Gentle introduction to GNN theory and its connection to causal transformers (causal masking as a directed, bipartite graph neural network)
      linkitems:
        - link: https://arxiv.org/abs/2512.09182
          linkname: written version
    - title: Improving the Attention Mechanism with Dynamic Relational Priming
      institution: Invited Lecture · SMU Lyle School of Engineering & Guildhall
      year: Spring 2025
      description:
        - 90-minute lecture on the ICML 2026 paper "Dynamic Relational Priming Improves Transformer in Multivariate Time Series"
        - Introduction to multivariate time series, its challenges in deep learning, and existing solutions
    - title: Analysis of Different Attention Mechanisms
      institution: Invited Lecture · SMU Lyle School of Engineering & Guildhall
      year: Spring 2025
      description:
        - 90-minute lecture on transformer variants, from linear and sparse attention to emerging variants such as differential and selective attention
      linkitems:
        - link: /articles/transformer-revolution/
          linkname: written version
    - title: Introduction to Graph Neural Networks
      institution: Invited Lecture · SMU Lyle School of Engineering & Guildhall
      year: Fall 2024
      description:
        - 90-minute lecture on graph machine learning — leveraging graph structure in data (molecules, social networks, traffic) for structured learning
        - Covered mathematical frameworks and a coding demo of widely used graph ML models
      linkitems:
        - link: https://github.com/timlee0131/introGNN-demos
          linkname: code demos
    - title: Privacy-Preserving Machine Learning in Neural Networks and Decision Trees
      institution: Invited Lecture · CS3341 Foundations of Modern Computing, SMU Lyle School of Engineering
      year: 2023
      description:
        - Talk based on "Blind Evaluation Framework for Fully Homomorphic Encryption and Privacy-Preserving Machine Learning"
        - Blind evaluation paradigm for encrypted programming
